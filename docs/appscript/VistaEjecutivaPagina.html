<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta e identidad de INRO VIATICOS (app/globals.css), para que este
     enlace se vea como parte de la misma familia visual que la aplicación. */
  :root {
    --bg:#EDF1F4; --surface:#FFFFFF; --surface3:#EEF2F6;
    --border:#E4E9EE; --border2:#D2DAE2;
    --accent:#00A298; --accent-texto:#007A72;
    --tinta:#1D1D1B; --text:#101A24; --text2:#52627A; --text3:#8494A8;
    --danger:#C62828; --warn:#A15C07;
    --sombra: 0 2px 4px rgba(16,26,38,.05), 0 6px 16px rgba(16,26,38,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  h2 { font-family: "Sora", sans-serif; font-size: 15px; font-weight: 700; margin: 0 0 16px; }
  .pagina { max-width: 1080px; margin: 0 auto; padding: 28px 24px 56px; }

  #cargando, #error { max-width: 1080px; margin: 60px auto; padding: 0 24px; color: var(--text2); font-size: 14px; }
  #error .sub { color: var(--text2); font-size: 13.5px; }

  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 16px;
              flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border2); }
  .marca { display: flex; align-items: center; gap: 16px; }
  .marca-titulo { font-family: "Sora", sans-serif; font-weight: 700; font-size: 17px; }
  .marca-sub { font-size: 12.5px; color: var(--text2); margin-top: 2px; }
  .boton { display: inline-flex; align-items: center; gap: 6px; background: var(--tinta); color: #fff;
           text-decoration: none; font-weight: 600; font-size: 13.5px; padding: 11px 18px; border-radius: 10px;
           box-shadow: var(--sombra); white-space: nowrap; }
  .boton:hover { background: #000; }
  .boton-accent { background: var(--accent); }
  .boton-accent:hover { background: var(--accent-texto); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
         padding: 18px 18px 16px; box-shadow: var(--sombra); }
  .kpi-rotulo { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .kpi-valor { font-family: "Sora", sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .kpi-valor-chico { font-size: 16px; font-weight: 700; }
  .kpi-extra { font-size: 12px; color: var(--text2); margin-top: 6px; }

  .dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 760px) { .dos-columnas { grid-template-columns: 1fr; } .cabecera { flex-direction: column; align-items: flex-start; } }

  .tarjeta { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--sombra); }
  .tarjeta-ancha { margin-bottom: 14px; }

  .fila-barra { margin-bottom: 14px; }
  .fila-barra:last-child { margin-bottom: 0; }
  .fb-cab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 10px; }
  .fb-etq { font-size: 13.5px; font-weight: 600; text-transform: capitalize; }
  .fb-cifras { font-size: 12.5px; color: var(--text2); white-space: nowrap; }
  .fb-pista { height: 8px; background: var(--surface3); border-radius: 6px; overflow: hidden; }
  .fb-relleno { height: 100%; border-radius: 6px; }
  .vacio { color: var(--text3); font-size: 13px; margin: 0; }

  .tabla { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tabla th { text-align: left; padding: 0 10px 10px 0; font-size: 11px; font-weight: 600; letter-spacing: .05em;
              text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border2); }
  .th-num { text-align: right; }
  .tabla td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text2); }
  .td-monto { color: var(--text); font-weight: 600; }
  .td-sub { font-size: 11.5px; color: var(--text3); margin-top: 2px; }

  .pie { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
         margin-top: 24px; font-size: 12px; color: var(--text3); }
</style>
</head>
<body>

</div>

    <a class="boton" id="enlaceHoja" href="#" target="_blank" rel="noopener">Abrir la hoja completa ↗</a>

  <section class="dos-columnas">
    <div class="tarjeta"><h2>Por tipo de comprobante</h2><div id="barrasTipo"></div></div>
    <div class="tarjeta"><h2>Emitidas vs. recibidas</h2><div id="barrasOrigen"></div></div>
  </section>

  <section class="tarjeta tarjeta-ancha">
    <h2>Evolución mensual</h2>
    <div id="barrasPeriodo"></div>
  </section>

  <section class="tarjeta tarjeta-ancha">
    <h2>Principales proveedores (comprobantes recibidos)</h2>
    <div id="tablaProveedores"></div>
  </section>

  <footer class="pie">
    <span id="pie"></span>
    <a class="boton boton-accent" id="enlaceHoja2" href="#" target="_blank" rel="noopener">Ver el detalle completo ↗</a>
  </footer>

</div>

<script>
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  function pedirDatos() {
    google.script.run
      .withSuccessHandler(pintar)
      .withFailureHandler(function (e) {
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('error').style.display = '';
        document.getElementById('errorTexto').textContent = e && e.message ? e.message : String(e);
      })
      .datosDeLaVistaEjecutiva();
  }

  function filaBarra(x) {
    return '<div class="fila-barra">' +
      '<div class="fb-cab">' +
      '<span class="fb-etq">' + esc(x.etiqueta) + '</span>' +
      '<span class="fb-cifras"><b>' + esc(x.montoTexto) + '</b> · ' + x.cantidad + (x.cantidad === 1 ? ' doc.' : ' docs.') + '</span>' +
      '</div>' +
      '<div class="fb-pista"><div class="fb-relleno" style="width:' + x.pct + '%; background:' + x.color + '"></div></div>' +
      '</div>';
  }

  function pintar(d) {
    document.getElementById('cargando').style.display = 'none';

    if (d.error) {
      document.getElementById('error').style.display = '';
      document.getElementById('errorTexto').textContent = d.error;
      return;
    }

    document.getElementById('pagina').style.display = '';
    document.getElementById('enlaceHoja').href = d.urlHoja;
    document.getElementById('enlaceHoja2').href = d.urlHoja;

    var otrasMonedasHtml = d.otrasMonedas.length
      ? d.otrasMonedas.map(function (m) { return '<div class="kpi-extra">+ ' + esc(m) + '</div>'; }).join('')
      : '';

    document.getElementById('kpis').innerHTML =
      tarjetaKpi('Comprobantes con detalle', d.totalDocumentosTexto) +
      tarjetaKpi('Monto total (' + esc(d.monedaPrincipal) + ')', esc(d.montoPrincipalTexto), otrasMonedasHtml) +
      tarjetaKpi('Proveedores distintos', d.proveedoresDistintosTexto) +
      tarjetaKpi('Con detracción', esc(d.montoDetraccionTexto), '<div class="kpi-extra">' + d.documentosConDetraccion + ' comprobantes</div>') +
      tarjetaKpi('Período cubierto', esc(d.rangoPeriodo), null, true);

    document.getElementById('barrasTipo').innerHTML = d.porTipo.length
      ? d.porTipo.map(filaBarra).join('') : '<p class="vacio">Sin datos.</p>';
    document.getElementById('barrasOrigen').innerHTML = d.porOrigen.length
      ? d.porOrigen.map(filaBarra).join('') : '<p class="vacio">Sin datos.</p>';
    document.getElementById('barrasPeriodo').innerHTML = d.periodos.length
      ? d.periodos.map(filaBarra).join('') : '<p class="vacio">Sin datos.</p>';

    document.getElementById('tablaProveedores').innerHTML = d.proveedoresTop.length
      ? '<table class="tabla"><thead><tr><th></th><th>Proveedor</th><th class="th-num">Comprobantes</th><th class="th-num">Monto</th></tr></thead><tbody>' +
        d.proveedoresTop.map(function (p, i) {
          return '<tr><td class="td-num">' + (i + 1) + '</td>' +
            '<td>' + esc(p.nombre) + '<div class="td-sub">' + esc(p.ruc) + '</div></td>' +
            '<td class="td-num">' + p.cantidad + '</td>' +
            '<td class="td-num td-monto">' + esc(p.montoTexto) + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="vacio">Sin comprobantes recibidos en el detalle.</p>';

    document.getElementById('pie').textContent =
      'Generado el ' + d.generadoEl + ' · a partir de "COMPROBANTES SUNAT - DETALLE"';
  }

  function tarjetaKpi(rotulo, valor, extraHtml, chico) {
    return '<div class="kpi"><div class="kpi-rotulo">' + esc(rotulo) + '</div>' +
      '<div class="kpi-valor' + (chico ? ' kpi-valor-chico' : '') + '">' + valor + '</div>' +
      (extraHtml || '') + '</div>';
  }

  pedirDatos();
</script>

</body>
</html>
