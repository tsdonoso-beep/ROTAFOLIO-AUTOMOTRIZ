<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batería y Cargador Inteligente — EPT Mecánica Automotriz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
        :root {
            --bg:        #fef9f0;
            --bg2:       #fff8ec;
            --card:      #ffffff;
            --border:    #e8dcc8;
            --shadow:    rgba(180,140,80,0.15);

            --ink:       #1a1008;
            --ink2:      #5a4530;
            --ink3:      #9a8060;

            --amber:     #f59e0b;
            --amber-lt:  #fef3c7;
            --amber-md:  #fde68a;

            --sky:       #0ea5e9;
            --sky-lt:    #e0f2fe;

            --mint:      #10b981;
            --mint-lt:   #d1fae5;

            --rose:      #f43f5e;
            --rose-lt:   #ffe4e6;

            --violet:    #8b5cf6;
            --violet-lt: #ede9fe;

            --orange:    #f97316;
            --orange-lt: #ffedd5;

            --card-colors: var(--amber), var(--sky), var(--mint), var(--rose),
                           var(--violet), var(--orange), #ec4899, #14b8a6,
                           #64748b, var(--amber), var(--sky), var(--mint),
                           var(--rose), var(--violet), var(--orange), #ec4899,
                           #14b8a6, #64748b, #6366f1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(245,158,11,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14,165,233,0.08) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d4b896' fill-opacity='0.18'%3E%3Ccircle cx='20' cy='20' r='1.5'/%3E%3C/g%3E%3C/svg%3E");
            color: var(--ink);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, #1a1008 0%, #2d1f0e 60%, #3d2a12 100%);
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 44px; height: 44px;
            background: var(--amber);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(245,158,11,0.4);
        }

        .header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }
        .header h1 span {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--amber);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-back {
            background: var(--amber);
            color: var(--ink);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            box-shadow: 0 2px 8px rgba(245,158,11,0.4);
        }
        .btn-back:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 4px 14px rgba(245,158,11,0.5); }
        .btn-back:active { transform: scale(0.98); }

        /* ── LAYOUT ── */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* ── INTRO BANNER ── */
        .intro-banner {
            background: linear-gradient(135deg, #fff8ec, #fef3c7);
            border: 2px solid var(--amber-md);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .intro-banner .big-icon { font-size: 3.5rem; flex-shrink: 0; }
        .intro-banner h2 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 900; color: var(--ink); }
        .intro-banner p { margin: 0; color: var(--ink2); font-size: 0.95rem; font-weight: 600; }
        .intro-count {
            margin-left: auto;
            background: var(--amber);
            color: var(--ink);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* ── VIEWS ── */
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── MENU GRID ── */
        .section-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ink3);
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        /* Palette cycling via nth-child */
        .menu-card { --c: var(--amber); }
        .menu-card:nth-child(7n+1)  { --c: #f59e0b; }
        .menu-card:nth-child(7n+2)  { --c: #0ea5e9; }
        .menu-card:nth-child(7n+3)  { --c: #10b981; }
        .menu-card:nth-child(7n+4)  { --c: #f43f5e; }
        .menu-card:nth-child(7n+5)  { --c: #8b5cf6; }
        .menu-card:nth-child(7n+6)  { --c: #f97316; }
        .menu-card:nth-child(7n+0)  { --c: #ec4899; }

        .menu-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-top: 4px solid var(--c);
            border-radius: 16px;
            padding: 20px 20px 18px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.34,1.2,0.64,1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 80px; height: 80px;
            background: radial-gradient(circle at top right, color-mix(in srgb, var(--c) 12%, transparent), transparent 70%);
            pointer-events: none;
        }
        .menu-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--c);
            box-shadow: 0 8px 24px color-mix(in srgb, var(--c) 25%, transparent);
        }
        .menu-card:active { transform: scale(0.98); }

        .menu-card .card-num {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--c);
            background: color-mix(in srgb, var(--c) 12%, transparent);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .menu-card h3 {
            margin: 0 0 8px;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.3;
        }
        .menu-card .card-hint {
            margin: 0;
            color: var(--ink3);
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .menu-card .card-arrow {
            position: absolute;
            right: 16px; bottom: 18px;
            width: 28px; height: 28px;
            background: var(--c);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.2s;
        }
        .menu-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* ── TOOL DETAIL ── */
        .tool-layout {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 24px;
            align-items: start;
        }

        /* Tool header strip */
        .tool-head-strip {
            background: linear-gradient(135deg, #1a1008, #2d1f0e);
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .tool-head-strip::after {
            content: attr(data-num);
            position: absolute;
            right: -10px; top: -20px;
            font-size: 8rem;
            font-weight: 900;
            font-family: 'Space Mono', monospace;
            color: rgba(255,255,255,0.04);
            line-height: 1;
            pointer-events: none;
        }
        .tool-head-strip .accent-dot {
            width: 56px; height: 56px;
            background: var(--amber);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(245,158,11,0.5);
        }
        .tool-head-strip h2 {
            margin: 0 0 6px;
            font-size: 1.7rem;
            font-weight: 900;
            color: #fff;
        }
        .badge {
            display: inline-block;
            background: rgba(245,158,11,0.2);
            color: var(--amber);
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(245,158,11,0.35);
        }

        /* Panels */
        .panel {
            background: var(--card);
            border-radius: 20px;
            padding: 28px;
            border: 2px solid var(--border);
            box-shadow: 0 2px 12px var(--shadow);
        }
        .panel-right {
            background: var(--bg2);
            border: 2px solid var(--border);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--ink2);
            margin: 24px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-title:first-child { margin-top: 0; }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }

        p.desc {
            font-size: 1rem;
            line-height: 1.75;
            color: var(--ink2);
            margin: 0;
        }

        .type-list {
            list-style: none;
            padding: 0; margin: 0;
            display: grid;
            gap: 10px;
        }
        .type-list li {
            background: var(--bg);
            padding: 14px 16px;
            border-radius: 12px;
            border-left: 4px solid var(--amber);
            font-size: 0.92rem;
            color: var(--ink2);
            line-height: 1.5;
        }
        .type-list li strong {
            color: var(--ink);
            display: block;
            font-size: 0.95rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        /* Alerts */
        .alert {
            padding: 18px 20px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.65;
            margin-bottom: 16px;
        }
        .alert strong {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.9rem;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .alert-pro {
            background: var(--mint-lt);
            border: 2px solid #86efac;
            color: #065f46;
        }
        .alert-pro strong { color: #047857; }
        .alert-fail {
            background: var(--rose-lt);
            border: 2px solid #fda4af;
            color: #881337;
        }
        .alert-fail strong { color: #be123c; }

        /* Video */
        .video-section { margin-top: 20px; }
        .video-label {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ink3);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .video-box {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 2px solid var(--border);
            background: #111;
            width: 100%;
            display: none;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 860px) {
            .tool-layout { grid-template-columns: 1fr; }
            .intro-banner { flex-wrap: wrap; }
            .intro-count { margin-left: 0; }
            .tool-head-strip { padding: 20px; }
            .tool-head-strip h2 { font-size: 1.4rem; }
        }
        @media (max-width: 500px) {
            .header h1 { font-size: 1.1rem; }
            .app-container { padding: 16px 14px 32px; }
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .menu-card { padding: 14px; }
        }

        /* ── BTN QR ── */
        .btn-qr {
            background: #ffffff22;
            color: #fff;
            border: 1.5px solid rgba(255,255,255,0.25);
            padding: 9px 18px;
            border-radius: 30px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-qr:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }

        /* ── VISTA QR ── */
        .qr-setup {
            background: linear-gradient(135deg, #1a1008, #2d1f0e);
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .qr-setup label {
            color: var(--amber);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }
        .qr-setup p {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin: 6px 0 0;
        }
        .qr-url-wrap { flex: 1; min-width: 260px; }
        .qr-url-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            outline: none;
            transition: border 0.2s;
        }
        .qr-url-input:focus { border-color: var(--amber); }
        .qr-url-input::placeholder { color: rgba(255,255,255,0.3); }
        .btn-gen {
            background: var(--amber);
            color: var(--ink);
            border: none;
            padding: 13px 26px;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            align-self: flex-end;
            margin-bottom: 0;
        }
        .btn-gen:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(245,158,11,0.4); }

        .qr-notice {
            background: var(--sky-lt);
            border: 2px solid #bae6fd;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 0.88rem;
            color: #0c4a6e;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .qr-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 20px 16px 16px;
            text-align: center;
            box-shadow: 0 2px 10px var(--shadow);
            transition: transform 0.2s;
        }
        .qr-card:hover { transform: translateY(-3px); }
        .qr-card-num {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--ink3);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .qr-card h4 {
            margin: 0 0 14px;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.3;
        }
        .qr-img-wrap {
            width: 150px;
            height: 150px;
            margin: 0 auto 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .qr-img-wrap img { width: 100%; height: 100%; display: block; }
        .qr-url-chip {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--ink3);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            word-break: break-all;
            margin-bottom: 12px;
            display: block;
        }
        .btn-print-all {
            background: var(--ink);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .btn-print-all:hover { background: #2d1f0e; transform: translateY(-1px); }
        @media print {
            .header, .qr-setup, .qr-notice, .btn-print-all, .btn-qr, .btn-back { display: none !important; }
            .qr-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
            .qr-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
            body { background: white !important; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-brand">
        <div class="header-icon">⚙️</div>
        <h1>
            <span>EPT — Mecánica Automotriz</span>
            Taller Automotriz
        </h1>
    </div>
    <a href="index.html" class="btn-back" style="text-decoration:none;display:block;">← Volver al Panel</a>
</header>

<div class="app-container">
    <div id="view-detail" class="view active">
        <div class="tool-head-strip" id="tool-head-strip" data-num="10">
            <div class="accent-dot" id="t-icon">🔩</div>
            <div>
                <h2 id="t-title">Cargando...</h2>
                <div class="badge" id="t-badge">...</div>
            </div>
        </div>
        <div class="tool-layout">
            <div class="panel">
                <p class="section-title">🎯 Misión Principal</p>
                <p class="desc" id="t-desc">...</p>
                <p class="section-title">🧬 Anatomía y Variantes</p>
                <ul class="type-list" id="t-types"></ul>
            </div>
            <div class="panel panel-right">
                <div class="alert alert-pro">
                    <strong>💡 Nivel Pro</strong>
                    <span id="t-pro"></span>
                </div>
                <div class="alert alert-fail">
                    <strong>⚠️ Precaución — Errores Comunes</strong>
                    <span id="t-danger"></span>
                </div>
                <div class="video-section" id="video-section" style="display:none;">
                    <p class="video-label">▶ Demo en acción</p>
                    <div class="video-box" id="t-video-box"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const toolData = {
        "1": {
            icon:"📏", title: "Calibrador Digital / Vernier", badge: "Metrología de Precisión",
            desc: "Dispositivo milimétrico que otorga al mecánico la capacidad de registrar anchuras, diámetros internos de tubos y niveles de profundidad. Es vital para asegurar que los componentes del vehículo sigan cumpliendo los estándares de fábrica.",
            types: [
                {name: "Mecánico Clásico", desc: "Sistema análogo que requiere alinear marcas visualmente en sus barras de acero. Alcanza resoluciones de 0.02 milímetros."},
                {name: "Versión Digital", desc: "Equipado con un pequeño visor electrónico que entrega medidas exactas al instante, llegando a calcular hasta 0.01 milímetros sin esfuerzo ocular."}
            ],
            pro: "Si necesitas confirmar si los discos de frenado del auto se han desgastado demasiado y requieren cambio urgente, esta es tu herramienta de diagnóstico definitiva.",
            danger: "Es un equipo sumamente delicado. Presionar sus patas contra una pieza a la fuerza o no guardarlo en su estuche de protección lo descalibrará permanentemente. Limpiar solo con alcohol isopropílico.",
            video: "2SLQvaGHDV4"
        },
        "2": {
            icon:"🔑", title: "Juego de Llaves Mixtas", badge: "Transmisión de Fuerza Manual",
            desc: "El equipo de mano base para cualquier estudiante. Creadas para atrapar tuercas y pernos, brindando la longitud necesaria para ejercer gran fuerza rotativa sin que resbalen de las manos.",
            types: [
                {name: "Extremo Abierto (U)", desc: "Perfecto para deslizar la herramienta desde el costado cuando no hay acceso por la parte superior del tornillo."},

function sanitize(text) {
        if (!text) return "";
        return text.replace(/\[cite_start\]/gi, '').replace(/\[cite[^\]]*\]/gi, '');
    }

    if (toolId && toolData[toolId]) {
        loadTool(toolId);
    } else {
        document.getElementById('view-menu').classList.add('active');
    }

    /* ── LOAD TOOL ── */
    function loadTool(id) {
        const data = toolData[id];

        document.getElementById('t-title').textContent = data.title;
        document.getElementById('t-badge').textContent = data.badge;
        document.getElementById('t-icon').textContent = data.icon;
        document.getElementById('t-desc').textContent = sanitize(data.desc);
        document.getElementById('t-pro').textContent = sanitize(data.pro);
        document.getElementById('t-danger').textContent = sanitize(data.danger);
        document.getElementById('tool-head-strip').setAttribute('data-num', id);

        const typesList = document.getElementById('t-types');
        typesList.innerHTML = '';
        data.types.forEach(t => {
            typesList.innerHTML += `<li><strong>⚙️ ${sanitize(t.name)}</strong>${sanitize(t.desc)}</li>`;
        });

        // Video
        const videoBox   = document.getElementById('t-video-box');
        const videoSect  = document.getElementById('video-section');
        videoBox.innerHTML = '';

        if (data.video && data.video.trim() !== "") {
            const vid = data.video;
            const sq  = encodeURIComponent(data.title + ' mecánica automotriz tutorial');
            const yt  = 'https://www.youtube.com/results?search_query=' + sq;

            videoSect.style.display = 'block';
            videoBox.style.display  = 'block';
            videoBox.innerHTML = `
                <div class="video-container">
                    <iframe id="vframe" src="https://www.youtube.com/embed/${vid}?rel=0"
                        allowfullscreen style="border:none;"
                        onload="checkVid(this,'${vid}','${yt}')"></iframe>
                </div>
                <div id="vfallback" style="display:none;padding:22px;text-align:center;background:#fff8ec;border-radius:0 0 14px 14px;">
                    <p style="color:#5a4530;margin:0 0 12px;font-size:0.9rem;font-weight:700;">📺 Video no disponible</p>
                    <a href="${yt}" target="_blank"
                       style="display:inline-block;background:#f43f5e;color:#fff;padding:9px 20px;border-radius:30px;text-decoration:none;font-weight:800;font-size:0.85rem;">
                       🔍 Buscar en YouTube
                    </a>
                </div>`;
        } else {
            videoSect.style.display = 'none';
        }

        document.getElementById('view-menu').classList.remove('active');
        document.getElementById('view-detail').classList.add('active');
        document.getElementById('btnBack').style.display = 'block';
        document.getElementById('btnQR').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function checkVid(iframe, videoId, ytUrl) {
        const img = new Image();
        img.onload = () => {
            if (img.naturalWidth === 120) showFallback();
        };
        img.onerror = () => showFallback();
        img.src = 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
        function showFallback() {
            const f = document.getElementById('vframe');
            const fb = document.getElementById('vfallback');
            if (f)  f.style.display = 'none';
            if (fb) fb.style.display = 'block';
        }
    }

    function showMenu() {
        document.getElementById('view-detail').classList.remove('active');
        document.getElementById('view-qr').classList.remove('active');
        document.getElementById('view-menu').classList.add('active');
        document.getElementById('btnBack').style.display = 'none';
        document.getElementById('btnQR').style.display = 'block';
        document.getElementById('t-video-box').innerHTML = '';
    }

    function showQR() {
        document.getElementById('view-menu').classList.remove('active');
        document.getElementById('view-detail').classList.remove('active');
        document.getElementById('view-qr').classList.add('active');
        document.getElementById('btnBack').style.display = 'block';
        document.getElementById('btnQR').style.display = 'none';
    }

    /* ── GENERADOR DE QR ── */
    function generateQRs() {
        const baseUrl = document.getElementById('base-url').value.trim().replace(/\/$/, '');
        if (!baseUrl) {
            document.getElementById('base-url').focus();
            document.getElementById('base-url').style.borderColor = '#f43f5e';
            setTimeout(() => document.getElementById('base-url').style.borderColor = '', 1500);
            return;
        }

        const grid  = document.getElementById('qr-grid');
        const label = document.getElementById('qr-grid-label');
        grid.innerHTML = '';
        label.style.display = 'flex';

        for (const id in toolData) {
            const item = toolData[id];
            // Usar hash (#id=N) para que el parámetro llegue al iframe en Google Sites
            const url  = `${baseUrl}#id=${id}`;
            // QR via API gratuita de qrserver.com (sin clave, 150x150, corrección alta)
            const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&ecc=H&data=${encodeURIComponent(url)}`;

            const card = document.createElement('div');
            card.className = 'qr-card';
            card.innerHTML = `
                <div class="qr-card-num">HERRAMIENTA #${id}</div>
                <h4>${item.icon} ${item.title}</h4>
                <div class="qr-img-wrap">
                    <img src="${qrSrc}" alt="QR herramienta ${id}" loading="lazy">
                </div>
                <span class="qr-url-chip">${url}</span>
            `;
            grid.appendChild(card);
        }

        // Scroll al grid
        label.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* limpia artefactos de citas */
    setInterval(() => {
        const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        let n;
        while (n = walk.nextNode()) {
            if (n.nodeValue.includes('[cite')) {
                n.nodeValue = n.nodeValue.replace(/\[cite_start\]/gi,'').replace(/\[cite[^\]]*\]/gi,'');
            }
        }
    }, 500);

// Cargar directamente la herramienta #10
loadTool("10");
</script>
</body>
</html>
