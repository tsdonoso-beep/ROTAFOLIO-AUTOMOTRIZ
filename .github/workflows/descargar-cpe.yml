# Bajar los XML de los comprobantes desde el portal de SUNAT
#
# El detalle de ítems no lo da ninguna API: sale del XML, y al XML solo se
# llega por la pantalla «Consultar Factura y Nota» de SOL, que tiene login.
# Por eso esto maneja un navegador (Playwright), y corre acá y no en Apps
# Script —que no puede manejar un navegador— ni en Vercel —que corta al minuto.
#
# Reusa los secretos que ya están: el usuario y clave de SOL son los mismos
# del SIRE. El repositorio es público: nada de esto va en un archivo.
#
# Arranca en modo depuración (debug=true): entra, llega a la pantalla y sube
# capturas y HTML como artefacto, sin bajar nada. Con eso se fijan los
# selectores. Cuando estén, se corre con debug=false para bajar de verdad.
#
# La corrida programada (cron) es aparte de la manual: pide solo ayer y hoy,
# nunca el mes completo. El script no sabe qué ya bajó antes de pedirlo a
# SUNAT —el "ya estaba" se detecta recién al subir a Drive—, así que un rango
# ancho todos los días repetiría cientos de descargas a diario y chocaría con
# el límite de solicitudes de SUNAT (visto de verdad: "User rate limit
# exceeded" al rellenar meses viejos con rangos de un mes completo). Una
# ventana de dos días es chica de sobra para mantener el mes en curso al día
# sin gastar esa cuota, y repetir un día ya bajado no duplica nada (Drive y la
# base detectan "ya estaba").

name: SUNAT descargar XML

on:
  schedule:
    # 08:00 en Lima (UTC-5 todo el año), igual que SUNAT diario.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Solo entrar y capturar la pantalla, sin bajar (para fijar selectores)."
        type: boolean
        required: false
        default: true
      fecha_inicio:
        description: "Desde (dd/mm/yyyy). Vacío = hace 30 días."
        required: false
        default: ""
      fecha_fin:
        description: "Hasta (dd/mm/yyyy). Vacío = hoy."
        required: false
        default: ""
      tipo_consulta:
        description: >-
          Uno o varios tipos del portal, separados por coma. El portal no
          tiene un «todo junto»: son consultas separadas (FE Emitidas, FE
          Recibidas, FE Rechazadas, NC Emitidas, NC Recibidas, ND Emitidas,
          ND Recibidas), y esto entra una sola vez y las recorre todas en la
          misma sesión, sin volver a loguearse por cada una.
        required: false
        default: "FE Emitidas,FE Recibidas,NC Emitidas,NC Recibidas,ND Emitidas,ND Recibidas"
      rango_prueba_imprimir:
        description: >-
          Prueba puntual, apagada si se deja vacía: además de la consulta
          normal (con el rango de arriba), pide el "imprimirListado" de
          SUNAT con ESTE otro rango (dd/mm/yyyy - dd/mm/yyyy) y compara qué
          periodo trae el HTML de vuelta —para saber si esa vista re-consulta
          de verdad o solo reimprime lo último corrido con Aceptar—. No baja
          ni guarda nada por su cuenta.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    # Con varios tipos de consulta en la misma corrida, un mes cargado puede
    # tardar bastante más que los ~4 minutos de un solo tipo.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Solo Chromium, que es lo que usa el script, con sus dependencias de
      # sistema. Evita bajar los otros navegadores.
      - run: npx playwright install --with-deps chromium

      # Solo aplica al cron: la corrida manual sigue mandando sus propias
      # fechas (o las por omisión del script, 30 días, pensadas para rellenar
      # meses viejos a mano). El cron nunca debe heredar ese rango ancho.
      - name: Calcular el rango de la corrida programada (ayer y hoy)
        id: rango
        if: github.event_name == 'schedule'
        run: |
          echo "desde=$(date -d 'yesterday' +%d/%m/%Y)" >> "$GITHUB_OUTPUT"
          echo "hasta=$(date +%d/%m/%Y)" >> "$GITHUB_OUTPUT"

      - name: Entrar a SOL y (si no es depuración) bajar los XML
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_INROPRIN_USUARIO: ${{ secrets.SUNAT_INROPRIN_USUARIO }}
          SUNAT_INROPRIN_CLAVE: ${{ secrets.SUNAT_INROPRIN_CLAVE }}
          SUNAT_INROPRIN_CLIENT_ID: ${{ secrets.SUNAT_INROPRIN_CLIENT_ID }}
          # La carpeta de Drive donde se archivan los comprobantes. Si no se
          # pone el secreto, el script usa la del proyecto por omisión.
          SUNAT_DRIVE_FOLDER: ${{ secrets.SUNAT_DRIVE_FOLDER }}
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          # Para dejar publicada la hoja "COMPROBANTES SUNAT - DETALLE" al
          # terminar, igual que hace SUNAT diario con la de cabeceras. Si
          # falta, el detalle igual se guarda y solo se salta la hoja.
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Solo hacen falta para guardar; en depuración no se tocan.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ROBOT_CORREO: ${{ secrets.ROBOT_CORREO }}
          ROBOT_CLAVE: ${{ secrets.ROBOT_CLAVE }}
          # El cron nunca es depuración: si algo falla, que falle de verdad
          # (se ve en el resumen del workflow) en vez de fingir éxito sin bajar nada.
          DEBUG: ${{ github.event_name == 'schedule' && '0' || (inputs.debug && '1' || '0') }}
          FECHA_INICIO: ${{ github.event_name == 'schedule' && steps.rango.outputs.desde || inputs.fecha_inicio }}
          FECHA_FIN: ${{ github.event_name == 'schedule' && steps.rango.outputs.hasta || inputs.fecha_fin }}
          TIPOS_CONSULTA: ${{ inputs.tipo_consulta || 'FE Emitidas,FE Recibidas,NC Emitidas,NC Recibidas,ND Emitidas,ND Recibidas' }}
          PROBAR_IMPRIMIR: ${{ inputs.rango_prueba_imprimir && '1' || '0' }}
          RANGO_PRUEBA_IMPRIMIR: ${{ inputs.rango_prueba_imprimir }}
        run: node --experimental-strip-types scripts/descargar-cpe.mts

      # Las capturas y el HTML de cada paso, para ver el portal real y fijar
      # los selectores. Se suben aunque el paso anterior falle.
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-sunat
          path: capturas/
          if-no-files-found: warn
          retention-days: 7
