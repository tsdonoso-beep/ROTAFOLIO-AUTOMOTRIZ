# Extraer un rango largo de comprobantes y dejarlo en una hoja aparte
#
# Es el mismo motor que «SUNAT descargar XML» (`descargar-cpe.yml`, mismo
# script, mismo login, mismo archivado en Drive). Se separó porque los dos
# trabajos son distintos de verdad y mezclarlos hacía daño:
#
#   • `descargar-cpe.yml` corre SOLO, todos los días a las 08:00, y pide una
#     ventana de dos días. Mantiene el mes en curso al día.
#   • este corre A MANO, pide meses completos, y además de archivar deja una
#     hoja con solo esos meses.
#
# Con un solo workflow, las dos cosas se pisaban: el cron heredaba el rango
# ancho del relleno (cientos de descargas repetidas a diario, y el «User rate
# limit exceeded» de SUNAT), o el relleno heredaba la ventana de dos días del
# cron. Acá el cron no existe: este workflow no arranca si nadie lo dispara.
#
# QUÉ TRAE DE NUEVO
#   1. Parte el rango en una consulta por MES (PARTIR_POR_MES=1). Pedirle dos
#      meses de golpe a SUNAT es justo lo que dispara su límite de solicitudes.
#   2. Deja una hoja aparte con esos meses (HOJA_DEL_RANGO=1), con el rango en
#      el nombre: «COMPROBANTES SUNAT - DETALLE 2026-08 a 2026-09». La hoja
#      histórica —«COMPROBANTES SUNAT - DETALLE», que trae todo— se sigue
#      actualizando igual; esta es además de esa, no en vez de esa.
#   3. Puede pedir BOLETAS, con el acceso ampliado de SOL.
#
# LAS BOLETAS SON OTRA PANTALLA, NO UNA OPCIÓN MÁS
#
# Confirmado contra el portal (capturas del 27/09/2026). «Consultar Boleta de
# Venta y Nota» no se parece a la pantalla de facturas: otro camino de menú
# (sin acceso directo, hay que bajar todo el árbol), un `<select>` de HTML en
# vez del combobox de jQuery, y una tabla HTML común en vez de la grilla dojox.
# El script las maneja como dos motores separados; lo de facturas no se tocó.
#
# Sus cuatro tipos, tal como los ofrece el desplegable: BVE Emitidas, BVE
# Recibidas, NC-BVE Emitidas, ND-BVE Emitidas. Las notas de boleta SOLO existen
# emitidas: el portal no ofrece recibidas y no hay que inventarlas.
#
# LO QUE TODAVÍA NO SE SABE: cómo se llaman de verdad los campos de fecha de
# esa pantalla. El portal solo muestra las etiquetas «Fecha de Inicio» y «Fecha
# de Fin», y un `name` no se ve en una captura. El script los busca por la
# etiqueta de su fila y, si no, por posición, y DICE EN EL REGISTRO cuál de los
# dos funcionó. Si ninguno los encuentra, abandona esa consulta en vez de
# aceptar con el rango que estuviera puesto.
#
# Por eso conviene la primera corrida con debug = true (lo que viene marcado):
# no baja nada, recorre el menú y deja en el registro los campos reales del
# formulario y las opciones reales del desplegable, más las capturas como
# artefacto.

name: SUNAT extraer rango (hoja aparte)

# A mano y nada más: es un relleno, no una tarea diaria.
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Solo mirar: entra, lista el menú y los tipos que ofrece este acceso, y no baja nada. Dejar en true la primera vez."
        type: boolean
        required: false
        default: true
      fecha_inicio:
        description: "Desde (dd/mm/yyyy)."
        required: false
        default: "01/08/2026"
      fecha_fin:
        description: "Hasta (dd/mm/yyyy)."
        required: false
        default: "30/09/2026"
      tipos_consulta:
        description: >-
          Los tipos a consultar, separados por coma. Los válidos son los diez
          del catálogo de lib/sunat/cpe-consulta.ts: FE Emitidas, FE Recibidas,
          NC Emitidas, NC Recibidas, ND Emitidas, ND Recibidas (pantalla de
          facturas) y BVE Emitidas, BVE Recibidas, NC-BVE Emitidas, ND-BVE
          Emitidas (pantalla de boletas). Un nombre que no esté en la lista
          corta la corrida antes del login, diciendo cuáles hay.
        required: false
        default: "FE Emitidas,FE Recibidas,NC Emitidas,NC Recibidas,ND Emitidas,ND Recibidas,BVE Emitidas,BVE Recibidas,NC-BVE Emitidas,ND-BVE Emitidas"
      menu_boletas:
        description: >-
          Normalmente VACÍO: el camino del menú de las boletas ya está
          confirmado en el catálogo (Empresas > Comprobantes de pago > SEE -
          SOL > Boleta de Venta Electrónica > Consultar Boleta de Venta y
          Nota). Queda por si SUNAT renombra alguna entrada y hace falta
          probar otro camino sin tocar código: los textos separados por «>».
        required: false
        default: ""

# Esto solo lee de SUNAT y escribe en la base y en Drive.
permissions:
  contents: read

jobs:
  extraer:
    runs-on: ubuntu-latest
    # Diez tipos por dos meses son veinte consultas en la misma sesión, y un
    # mes cargado con seis tipos ya rondaba la hora. El tope de un job de
    # GitHub son 6 horas; se deja algo de margen debajo para que el fallo, si
    # llega, sea del script y no un corte a mitad de descarga.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Solo Chromium, que es lo que usa el script, con sus dependencias de
      # sistema. Evita bajar los otros navegadores.
      - run: npx playwright install --with-deps chromium

      - name: Entrar a SOL y (si no es depuración) bajar el rango
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          # El acceso ampliado de SOL, el que puede ver boletas. Si estos dos
          # secretos no están puestos, el script cae a los del SIRE —los de
          # siempre— y todo sigue funcionando como antes, solo que sin boletas.
          SUNAT_SOL_USUARIO: ${{ secrets.SUNAT_SOL_USUARIO }}
          SUNAT_SOL_CLAVE: ${{ secrets.SUNAT_SOL_CLAVE }}
          SUNAT_INROPRIN_USUARIO: ${{ secrets.SUNAT_INROPRIN_USUARIO }}
          SUNAT_INROPRIN_CLAVE: ${{ secrets.SUNAT_INROPRIN_CLAVE }}
          SUNAT_INROPRIN_CLIENT_ID: ${{ secrets.SUNAT_INROPRIN_CLIENT_ID }}
          # La carpeta de Drive donde se archivan los comprobantes. Si no se
          # pone el secreto, el script usa la del proyecto por omisión.
          SUNAT_DRIVE_FOLDER: ${{ secrets.SUNAT_DRIVE_FOLDER }}
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          # Hace falta para dejar las hojas publicadas. Si falta, lo bajado
          # igual queda archivado y guardado, y solo se saltan las hojas.
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ROBOT_CORREO: ${{ secrets.ROBOT_CORREO }}
          ROBOT_CLAVE: ${{ secrets.ROBOT_CLAVE }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          FECHA_INICIO: ${{ inputs.fecha_inicio }}
          FECHA_FIN: ${{ inputs.fecha_fin }}
          TIPOS_CONSULTA: ${{ inputs.tipos_consulta }}
          MENU_BOLETAS: ${{ inputs.menu_boletas }}
          # Las dos cosas que distinguen a este workflow del diario.
          PARTIR_POR_MES: "1"
          HOJA_DEL_RANGO: "1"
        # con-bitacora: hora y nivel en cada línea y logs/<script>-<fecha>/ (eventos, HTTP con error, resumen).
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/local/comun/con-bitacora.mts scripts/descargar-cpe.mts

      # Las capturas y el HTML de cada paso: es la evidencia con la que se
      # fijan el menú y la etiqueta de las boletas. Se suben aunque el paso
      # anterior falle, que es justo cuando más se necesitan.
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-sunat-rango
          path: capturas/
          if-no-files-found: warn
          retention-days: 7

      - name: Subir bitácoras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitacoras-extraer-cpe-rango
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
