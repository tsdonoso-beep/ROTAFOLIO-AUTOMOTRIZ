# Leer las carpetas madre de compras nacionales («5. Ordenes de Compra») y
# de importaciones
#
# Recorre las carpetas de OC con la cuenta de servicio de Drive y anota de
# cada OC su carpeta y los comprobantes que tiene (factura, XML, RH…, con la
# serie si el nombre la trae). Lo que el nombre no explica se abre y se lee
# por dentro (XML, ZIP, texto del PDF u OCR), una sola vez por archivo. Con eso la base une cada factura de SUNAT con su OC nacional, y las
# hojas COMPROBANTES SUNAT y DETALLE lo muestran en la publicación de la
# mañana. Ver scripts/carpetas-oc.mts.
#
# Las dos carpetas tienen que estar compartidas como Lector con el correo de
# la cuenta de servicio (GOOGLE_SA_EMAIL). Cada noche corren las dos.
#
# Además arma el legajo de cada OC (qué le falta), su centro de costo, y en
# las corridas completas anota qué cambió desde la anterior (pestaña CAMBIOS).
#
# Disparo manual: arranca en depuración (no toca la base ni la hoja); se
# elige nacionales, importaciones o ambas, y nacionales se puede limitar a un
# proyecto («TALLERES»). La lectura pesada también corre en una computadora:
# `pnpm carpetas:local` (docs/carpetas-oc-local.md); continúa donde quedó. El resumen —cuántas OC, carpetas
# y comprobantes encontró— queda en la página de la corrida, y los CSV como
# artefacto.

name: Carpetas de OC (nacionales e importaciones)

on:
  schedule:
    # 02:00 en Lima (UTC-5): antes de «SUNAT diario» (08:00), que publica las
    # hojas con lo que encuentre.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Solo leer y mostrar el resumen, sin subir a la base ni publicar la hoja."
        type: boolean
        required: false
        default: true
      carpeta:
        description: "Qué carpeta madre leer."
        type: choice
        options: [nacionales, importaciones, ambas]
        default: nacionales
      subcarpeta:
        description: "Solo en nacionales: los proyectos cuyo nombre contiene este texto (vacío = toda la carpeta). Importaciones se lee siempre entera."
        required: false
        default: "TALLERES ESPECIALIZADOS"
      leer_max:
        description: "Cuántos archivos abrir y leer por dentro (OCR) como mucho, por carpeta madre."
        required: false
        default: "200"
      leer_minutos:
        description: "Minutos de lectura por dentro, por carpeta madre (máximo ~150; vacío = 15 en depuración, 45/30 de verdad)."
        required: false
        default: ""

concurrency:
  group: carpetas-oc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    # Recorrer las dos carpetas (~10 min) + leer por dentro (hasta 150 + 150
    # min a mano; 45 + 30 cada noche) + subir. GitHub corta a las 6 h.
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Para leer por dentro: pdftotext/pdftoppm (PDF) y tesseract (OCR, español e inglés).
      - name: Instalar lectores de PDF y OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng

      - name: Leer la carpeta de compras nacionales
        # La de cada noche no trae inputs: corre (vacío ≠ importaciones).
        if: inputs.carpeta != 'importaciones'
        env:
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ROBOT_CORREO: ${{ secrets.ROBOT_CORREO }}
          ROBOT_CLAVE: ${{ secrets.ROBOT_CLAVE }}
          # La corrida de cada noche (sin inputs) va completa y de verdad.
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          PROCEDENCIA: nacional
          SUBCARPETA: ${{ inputs.subcarpeta }}
          # Cada noche: hasta 3000 archivos o 45 min de lectura; lo que no alcance, la noche siguiente.
          LEER_MAX: ${{ inputs.leer_max || '3000' }}
          LEER_MINUTOS: ${{ inputs.leer_minutos || (inputs.debug && '15' || '45') }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/local/comun/con-bitacora.mts scripts/carpetas-oc.mts

      - name: Leer la carpeta de importaciones
        if: always() && (github.event_name == 'schedule' || inputs.carpeta == 'importaciones' || inputs.carpeta == 'ambas')
        env:
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ROBOT_CORREO: ${{ secrets.ROBOT_CORREO }}
          ROBOT_CLAVE: ${{ secrets.ROBOT_CLAVE }}
          # La corrida de cada noche (sin inputs) va completa y de verdad.
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          PROCEDENCIA: importacion
          # Siempre entera: el filtro de subcarpeta es para los proyectos de nacionales.
          SUBCARPETA: ""
          LEER_MAX: ${{ inputs.leer_max || '3000' }}
          LEER_MINUTOS: ${{ inputs.leer_minutos || (inputs.debug && '15' || '30') }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/local/comun/con-bitacora.mts scripts/carpetas-oc.mts

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carpetas-oc
          path: salida/carpetas-oc/
          if-no-files-found: warn
          retention-days: 14

      - name: Subir bitácoras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitacoras-carpetas-oc
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
