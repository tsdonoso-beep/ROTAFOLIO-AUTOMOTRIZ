<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard EPT - Mecánica Automotriz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        :root {
            --bg-page: #0f172a; --bg-card: #1e293b; --primary: #3b82f6; --secondary: #8b5cf6;
            --accent: #10b981; --danger: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        body {
            font-family: 'Outfit', sans-serif; background-color: var(--bg-page);
            color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center;
        }
        .app-container { width: 100%; max-width: 1200px; padding: 20px; box-sizing: border-box; }
        .header {
            background: linear-gradient(90deg, var(--bg-card), rgba(59, 130, 246, 0.1));
            padding: 30px 40px; border-radius: 24px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 { margin: 0; font-size: 2.2rem; font-weight: 900; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 1.1rem; }
        .btn-back {
            background: var(--primary); color: white; border: none; padding: 12px 25px;
            border-radius: 12px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.3s; display: none; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-back:hover { transform: translateY(-2px); background: #2563eb; }
        .view { display: none; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .menu-card {
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 25px; cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .menu-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.15); }
        .menu-card .num { position: absolute; top: -15px; right: -15px; font-size: 5rem; font-weight: 900; color: rgba(255,255,255,0.03); line-height: 1; pointer-events: none; }
        .menu-card h3 { margin: 0 0 10px 0; font-size: 1.3rem; color: #fff; z-index: 2; position: relative;}
        .menu-card p { margin: 0; color: var(--text-muted); font-size: 0.9rem; z-index: 2; position: relative;}
        .tool-layout { display: grid; grid-template-columns: 1.8fr 1fr; gap: 30px; }
        .panel { background: var(--bg-card); border-radius: 24px; padding: 35px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .tool-header h2 { font-size: 2.5rem; margin: 0 0 10px 0; color: #fff; }
        .badge { display: inline-block; background: rgba(59, 130, 246, 0.2); color: #93c5fd; padding: 6px 15px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; border: 1px solid rgba(59, 130, 246, 0.3); margin-bottom: 25px;}
        h3.section-title { color: #cbd5e1; font-size: 1.3rem; margin: 30px 0 15px 0; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid rgba(255,255,255,0.05); padding-bottom: 10px;}
        p.desc { font-size: 1.1rem; line-height: 1.7; color: #cbd5e1; }
        .type-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 15px; }
        .type-list li { background: rgba(0,0,0,0.2); padding: 15px 20px; border-radius: 16px; border-left: 4px solid var(--secondary); font-size: 1rem; color: #94a3b8;}
        .type-list li strong { color: #fff; display: block; font-size: 1.1rem; margin-bottom: 5px;}
        .alert { padding: 20px; border-radius: 16px; margin-top: 25px; font-size: 1rem; line-height: 1.6; }
        .alert strong { display: block; font-size: 1.2rem; margin-bottom: 5px; }
        .alert-pro { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #a7f3d0; border-left: 5px solid var(--accent);}
        .alert-pro strong { color: var(--accent); }
        .alert-fail { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fecaca; border-left: 5px solid var(--danger);}
        .alert-fail strong { color: var(--danger); }
        .video-box { border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); background: #000; width: 100%; margin-top: 20px; display: none;}
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 900px) {
            .tool-layout { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 15px; text-align: center; padding: 20px; }
            .btn-back { width: 100%; }
        }
    </style>
</head>

            </div>
        </div>
    </div>
</div>

        card.onclick = () => loadTool(id);
        menuGrid.appendChild(card);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const toolId = urlParams.get('id');

    function sanitize(text) {
        if (!text) return "";
        return text.replace(/\[cite_start\]/gi, '').replace(/\[cite[^\]]*\]/gi, '');
    }

    if (toolId && toolData[toolId]) {
        loadTool(toolId);
    } else {
        document.getElementById('view-menu').classList.add('active');
        document.getElementById('header-desc').textContent = "Selecciona la ficha interactiva del equipo.";
    }

    function loadTool(id) {
        const data = toolData[id];
        document.getElementById('t-title').textContent = data.title;
        document.getElementById('t-badge').textContent = data.badge;
        document.getElementById('t-desc').textContent = sanitize(data.desc);
        document.getElementById('t-pro').textContent = sanitize(data.pro);
        document.getElementById('t-danger').textContent = sanitize(data.danger);

        const typesList = document.getElementById('t-types');
        typesList.innerHTML = '';
        data.types.forEach(t => { typesList.innerHTML += `<li><strong>⚙️ ${sanitize(t.name)}</strong> ${sanitize(t.desc)}</li>`; });

        const videoBox = document.getElementById('t-video-box');
        const videoTitle = document.getElementById('t-video-title');
        
        if (data.video && data.video.trim() !== "") {
            videoTitle.style.display = 'block';
            videoBox.style.display = 'block';
            videoBox.innerHTML = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${data.video}?rel=0" allowfullscreen></iframe></div>`;
        } else {
            videoTitle.style.display = 'none';
            videoBox.style.display = 'none';
            videoBox.innerHTML = '';
        }

        document.getElementById('view-menu').classList.remove('active');
        document.getElementById('view-detail').classList.add('active');
        document.getElementById('btnBack').style.display = 'block';
        document.getElementById('header-desc').textContent = "Ficha Técnica Desplegada";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showMenu() {
        document.getElementById('view-detail').classList.remove('active');
        document.getElementById('view-menu').classList.add('active');
        document.getElementById('btnBack').style.display = 'none';
        document.getElementById('header-desc').textContent = "Selecciona la ficha interactiva del equipo.";
        document.getElementById('t-video-box').innerHTML = '';
    }

    // Limpiador agresivo de DOM para evitar marcas de la IA
    setInterval(() => {
        const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        let n;
        while (n = walk.nextNode()) {
            if (n.nodeValue.includes('[cite')) {
                n.nodeValue = n.nodeValue.replace(/\[cite_start\]/gi, '').replace(/\[cite[^\]]*\]/gi, '');
            }
        }
    }, 150);
</script>

</body>
</html>
